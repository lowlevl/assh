[package]
name = "assh"
description = "A low-level SSH library handling the transport and key-exchange, not more, not less."
documentation = "https://docs.rs/assh"
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
authors.workspace = true
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]

# Whether to pass `--all-features` to Cargo (default: false)
all-features = true

# Enable unstable features in the documentation
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
futures.workspace = true

either.workspace = true
tracing.workspace = true
thiserror.workspace = true

strum = { version = "0.28.0", features = ["derive"] }
secrecy = "0.10.3"
heapless = "0.9.3"
bytes = "1.12.1"

ssh-key.workspace = true
ssh-packet.workspace = true

rand.workspace = true
signature = "3.0.0"

# Key-exchange algorithms
x25519-dalek = { version = "3.0.0", features = ["zeroize"] }

# Compression algorithms
flate2 = "1.1.9"

# Cipher algorithms
cipher = "0.5.2"

cbc = "0.2.1"
ctr = "0.10.1"
aead = "0.6.1"

des = "0.9.0"
aes = "0.9.1"
# aes-gcm = "0.11.0"

# MAC algorithms
digest = "0.11.3"
hmac = "0.13.0"

md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"

[dev-dependencies]
rstest = "0.26.1"
async-std = { version = "1.13.2", features = ["attributes", "unstable"] }

tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "tracing-log",
] }
